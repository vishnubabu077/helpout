spring:
  application:
    name: instant-help-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/instanthelp}
    username: ${DB_USER:instanthelp}
    password: ${DB_PASSWORD:instanthelp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway migrations
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:                          # rebuildable read cache only; Postgres stays the source of truth
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000          # fail fast when the broker is down; the outbox row stays unpublished
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: helper-geo-projector
      auto-offset-reset: earliest   # a new projector replays history; events are idempotent
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:}          # required, at least 32 bytes. No default on purpose.
    issuer: instant-help
    access-token-ttl: 15m
  otp:
    fixed-code: ${OTP_FIXED_CODE:}  # dev only. Startup fails if set while the "prod" profile is active.
    ttl: 5m
    max-attempts: 5
    max-requests-per-hour: 5
  task:
    min-duration-minutes: 30        # assumption from the sketch; confirm with product
    default-currency: EUR
  matching:
    search-radius-m: ${MATCHING_SEARCH_RADIUS_M:5000}
    candidate-count: ${MATCHING_CANDIDATE_COUNT:10}
    offer-ttl: ${MATCHING_OFFER_TTL:30s}
    heartbeat-timeout: ${MATCHING_HEARTBEAT_TIMEOUT:90s}
    sweep-interval: ${MATCHING_SWEEP_INTERVAL:5s}
  outbox:
    poll-interval: ${OUTBOX_POLL_INTERVAL:500ms}
    batch-size: ${OUTBOX_BATCH_SIZE:100}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
