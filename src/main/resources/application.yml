spring:
  application:
    name: instant-help-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/instanthelp}
    username: ${DB_USER:instanthelp}
    password: ${DB_PASSWORD:instanthelp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway migrations
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:}          # required, at least 32 bytes. No default on purpose.
    issuer: instant-help
    access-token-ttl: 15m
  otp:
    fixed-code: ${OTP_FIXED_CODE:}  # dev only. Startup fails if set while the "prod" profile is active.
    ttl: 5m
    max-attempts: 5
    max-requests-per-hour: 5
  task:
    min-duration-minutes: 30        # assumption from the sketch; confirm with product
    default-currency: EUR

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
