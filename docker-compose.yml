name: instant-help

services:
  # Local PostgreSQL. Started by default: `docker compose up -d`
  postgres:
    image: postgres:16-alpine
    container_name: instant-help-postgres
    environment:
      POSTGRES_DB: instanthelp
      POSTGRES_USER: instanthelp
      POSTGRES_PASSWORD: instanthelp
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instanthelp -d instanthelp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis: rebuildable read cache of AVAILABLE helpers (GEO index). No persistence on purpose.
  redis:
    image: redis:7-alpine
    container_name: instant-help-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  #   kafka:9092       for other containers (the app container)
  #   localhost:29092  for the app running on your machine
  kafka:
    image: apache/kafka:3.8.0
    container_name: instant-help-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # The Spring Boot app in a container. Only starts with the "app" profile:
  #   docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    container_name: instant-help-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local      # local = dev secret + fixed OTP 000000 (never use in production)
      DB_URL: jdbc:postgresql://postgres:5432/instanthelp
      DB_USER: instanthelp
      DB_PASSWORD: instanthelp
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
